<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --bg2: #161b22;

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1c2431 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    touch-action: manipulation;
    padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
  }
  header {
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px 10px;
  }
  .logo { display: flex; align-items: baseline; gap: 7px; }
  .logo .flame { font-size: 22px; }
  .logo b { font-size: 22px; letter-spacing: -0.03em; font-weight: 700; }
  .logo b em { color: var(--purple); font-style: normal; }
  .tally { font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.35; }
  .tally b { color: var(--fg); font-variant-numeric: tabular-nums; }

  .deck { position: relative; width: 100%; max-width: 380px; flex: 1; min-height: 0; }
  .card {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, var(--bg2), #11161d);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
    padding: 16px 16px 14px;
    will-change: transform;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .card .profile { display: flex; align-items: center; gap: 10px; }
  .profile img, .profile .init {
    width: 40px; height: 40px; border-radius: 50%;
    background: #21262d; border: 1px solid var(--border); object-fit: cover; flex: none;
  }
  .profile .init {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-weight: 600; font-size: 15px;
  }
  .who { min-width: 0; }
  .who .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .sub { font-size: 12px; color: var(--muted); }
  .title {
    margin-top: 14px;
    font-size: 17.5px; line-height: 1.3; font-weight: 600;
    text-transform: capitalize; letter-spacing: 0.01em;
    min-height: 4.1em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .title a { color: inherit; text-decoration: none; }
  .labels { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 24px; }
  .chip {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--border); text-transform: lowercase; color: #fff;
    background: #30363d; white-space: nowrap;
  }
  .chip.draft { background: transparent; color: var(--muted); border-color: var(--muted); }
  .bio {
    margin-top: auto;
    font-size: 13.5px; line-height: 1.5; color: #c9d1d9;
    background: rgba(88,166,255,.06);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px;
  }
  .bio .hi { color: var(--muted); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .meta { margin-top: 9px; font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }

  .stamp {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    font-size: 34px; font-weight: 800; letter-spacing: 0.1em;
    padding: 14px 26px; border-radius: 16px; border: 5px solid;
    opacity: 0; pointer-events: none; white-space: nowrap;
    text-transform: uppercase; transition: opacity .12s ease;
  }
  #stamp-no { color: var(--red); border-color: var(--red); background: rgba(248,81,73,.18); }
  #stamp-yes { color: var(--purple); border-color: var(--purple); background: rgba(163,113,247,.18); }

  .actions { display: flex; justify-content: center; gap: 26px; padding: 16px 0 6px; }
  .btn {
    width: 62px; height: 62px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .08s ease, box-shadow .2s ease, border-color .2s;
  }
  .btn:active { transform: scale(.86); }
  #no { color: var(--red); }
  #no:active { border-color: var(--red); box-shadow: 0 0 18px rgba(248,81,73,.4); }
  #yes { color: var(--purple); }
  #yes:active { border-color: var(--purple); box-shadow: 0 0 18px rgba(163,113,247,.45); }
  .btn svg { width: 30px; height: 30px; fill: currentColor; }

  footer { font-size: 10.5px; color: #6e7681; padding-top: 4px; text-align: center; }
  footer a { color: #6e7681; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(12px);
    background: #21262d; border: 1px solid var(--border); color: var(--fg);
    font-size: 13px; padding: 9px 15px; border-radius: 999px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: 88vw; text-align: center; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #match {
    position: fixed; inset: 0; background: rgba(13,17,23,.94); z-index: 60;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  #match.show { display: flex; }
  #match h2 { margin: 0; font-size: 30px; color: var(--purple); letter-spacing: .02em; }
  #match p { margin: 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  #match img { width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--purple); box-shadow: 0 0 40px rgba(163,113,247,.5); }
  #match button {
    margin-top: 16px; background: var(--purple); color: #fff; border: 0;
    padding: 11px 26px; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
</style>

].map(p=>({n:p[0],title:p[1],author:p[2],draft:!!p[3],created:String(p[4]).replace(/(\d{4})(\d{2})(\d{2})/,"$1-$2-$3"),avatar:p[5]?"https://avatars.githubusercontent.com/"+p[2]+"?v=4&size=160":"",labels:p[6].map(l=>({name:l[0],color:l[1]}))}));

/* ---------- infinite deck ---------- */
let queue = [], idx = 0, round = 1;
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function refill(){ queue = shuffle(PRS.slice()); idx = 0; }
function nextPR(){
  if (idx >= queue.length) {
    round++;
    refill();
    toast(round === 2 ? "It's a match made in CI heaven — round 2 💌" : "Back on the market — round " + round + " 🔁");
  }
  return queue[idx++];
}
refill();

/* ---------- comedic bios (deterministic per PR, no re-roll) ---------- */
const RED = ["Still on a two-month-old master. Looking for someone to fix that.",
 "My tests fail, but I'm working on myself. Swipe right and I'll change.",
 "CI failed once. Okay, 61 times. Everybody has a past.",
 "The red ❌ is my toxic ex, not me."];
const NICE = ["Comes with tests, docs, and a changelog entry. I'm a catch and I know it.",
 "Fuzzed every night for a year. Still standing. Still glowing.",
 "My coverage numbers? Say no more. Just say when."];
const BASE = ["Long walks through the review queue.",
 "Just a normal PR. Nothing to declare. Definitely not LLM-generated.",
 "I was written in 14 minutes by an agent that has since been deleted. Review me gently.",
 "My author has never compiled me. We are, strictly speaking, pen pals.",
 "Looking for a merge, not a hookup. Ready to settle down on master.",
 "Will argue UTXO semantics on the first date.",
 "My love language is 'Addressed comments' with a weekly 'any thoughts?' ping.",
 "Dislikes: rebases. Loves: concept ACKs from maintainers I've never met.",
 "I promise the failure is a flake. They're all flakes, baby.",
 "I've been in this queue since I arrived. We can still make it work.",
 "My author works somewhere you've heard of. My CI budget is unlimited.",
 "Take me as I am: 4,000 lines, one test, infinite opinions."];
const LAB = {"Needs rebase":["'Needs rebase' is just a label the haters gave me."],
 "CI failed":["I fail, therefore I am. Descartes, probably, watching my CI."],
 "Tests":["I bring my own tests to every first date."],
 "Wallet":["I touch wallet code. My ex, 0.21, still misses me."],
 "P2P":["I know all the peers. Some say too many."],
 "Refactoring":["I don't change behavior, I just glow up."],
 "Docs":["I'll read the release notes to you at night."],
 "Backport":["Not my first repo. I've been merged elsewhere. I know how the world works."],
 "Build system":["I break the builders, then apologize beautifully."],
 "Fuzzing":["Fuzzed nightly. Nobody has ever complained. To my face."],
 "PSBT":["Output descriptors are my only descriptors."],
 "Descriptors":["Output descriptors are my only descriptors."],
 "Mining":["I mine. You profit. It's a business relationship."],
 "Mempool":["I got evicted once. I don't like to talk about it."],
 "RPC/REST/ZMQ":["Talk RPC to me."],
 "Validation":["I reject your invalid block and then ask for a commit."],
 "Utils/log/libs":["Small, quiet, low-maintenance. The one your parents wanted."],
 "Private Broadcast":["Very private. Very broadcast. Swipe to find out."]};
function pick(pool, n){ return pool[n % pool.length]; }
function bioFor(pr){
  const n = pr.n; let s;
  const names = pr.labels.map(x => x.name);
  if (names.includes("Needs rebase")) s = "🚩 " + pick(RED.concat(LAB["Needs rebase"]), n);
  else if (names.includes("CI failed")) s = "🚩 " + pick(RED.concat(LAB["CI failed"]), n);
  else if (names.includes("Tests")) s = "✅ " + pick(NICE, n);
  else {
    let lab = null;
    for (const k of Object.keys(LAB)) if (names.includes(k)) { lab = k; break; }
    s = lab ? pick(LAB[lab], n) : pick(BASE, n);
  }
  if (pr.labels.length >= 4) s += " Also: looking for someone who can handle ALL of this.";
  if (pr.draft) s += " (It's not you, it's me — I'm just not ready yet.)";
  return s;
}
function daysOpen(pr){ return Math.max(0, Math.round((Date.parse("2026-10-25") - Date.parse(pr.created)) / 864e5)); }

/* ---------- render ---------- */
const el = id => document.getElementById(id);
const deck = el("deck"), card = el("card");
let current = null, yes = 0, no = 0;
el("pool").textContent = PRS.length + " lonely PRs";
el("frozen").textContent = "Oct 25, 2026";

function render(pr){
  current = pr;
  const av = el("avatar");
  if (pr.avatar) { av.src = pr.avatar; av.style.display = "block"; }
  else av.style.display = "none";
  el("name").textContent = "@" + pr.author;
  const d = daysOpen(pr);
  el("sub").textContent = "wants to merge · #" + pr.n;
  el("title").innerHTML = '<a href="https://github.com/bitcoin/bitcoin/pull/' + pr.n + '" target="_blank" rel="noopener">' + esc(pr.title) + '</a>';
  const lab = el("labels"); lab.innerHTML = "";
  if (pr.draft) { const c = document.createElement("span"); c.className = "chip draft"; c.textContent = "draft"; lab.appendChild(c); }
  for (const l of pr.labels.slice(0, 6)) {
    const c = document.createElement("span"); c.className = "chip";
    c.style.background = "#" + (l.color || "30363d");
    c.style.color = lum(l.color) > 0.55 ? "#111" : "#fff";
    c.textContent = l.name; lab.appendChild(c);
  }
  el("bio").textContent = bioFor(pr);
  el("meta-age").textContent = pr.created + " · " + (d === 0 ? "new here, be gentle" : d + " day" + (d===1?"":"s") + " in the queue");
  el("meta-act").textContent = (pr.labels.some(l => l.name === "CI failed") ? "CI: heartbroken" : "CI: optimistic");
  setStamp(0);
  apply(0, 0);
  card.style.display = "flex";
}
function esc(s){ return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function lum(hex){
  const c = parseInt(hex || "30363d", 16);
  return (0.2126*((c>>16)&255) + 0.7152*((c>>8)&255) + 0.0722*(c&255)) / 255;
}
function useInit(){
  const av = el("avatar");
  av.style.display = "none";
  if (!document.getElementById("init")) {
    const d = document.createElement("div");
    d.className = "init"; d.id = "init";
    av.after(d);
  }
  document.getElementById("init").textContent = current ? current.author.slice(0,2).toUpperCase() : "?";
}

/* ---------- swipe physics ---------- */
let px = null, py = null, dx = 0, dy = 0, dragging = false, moved = false;
const TH = 110;
function apply(dx_, dy_){
  const r = dx_ / 18;
  card.style.transform = "translate(" + dx_ + "px," + dy_ + "px) rotate(" + Math.max(-18, Math.min(18, r)) + "deg)";
  const t = Math.max(-1, Math.min(1, dx_ / 90));
  el("stamp-no").style.opacity = Math.max(0, -t);
  el("stamp-yes").style.opacity = Math.max(0, t);
  el("stamp-no").style.transform = "scale(" + (1 + 0.35*Math.max(0,-t)) + ") rotate(-14deg)";
  el("stamp-yes").style.transform = "scale(" + (1 + 0.35*Math.max(0,t)) + ") rotate(12deg)";
}
function setStamp(v){ el("stamp-no").style.opacity = v; el("stamp-yes").style.opacity = v; }
card.addEventListener("pointerdown", e => { if (dragging) return; dragging = true; moved = false; px = e.clientX; py = e.clientY; card.setPointerCapture(e.pointerId); });
card.addEventListener("pointermove", e => {
  if (!dragging) return;
  dx = (e.clientX - px); dy = Math.max(-40, Math.min(40, (e.clientY - py) / 6));
  if (Math.abs(e.clientX - px) > 5 || Math.abs(e.clientY - py) > 5) moved = true;
  apply(dx, dy);
});
card.addEventListener("pointerup", () => {
  if (!dragging) return; dragging = false;
  if (Math.abs(dx) > TH) swipe(dx > 0);
  else apply(0, 0);
  dx = 0; dy = 0;
});
card.addEventListener("pointercancel", () => { dragging = false; apply(0, 0); });
el("title").addEventListener("click", e => { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);

function fly(right, cb){
  const far = (right ? 1 : -1) * (window.innerWidth + 120);
  card.style.transition = "transform .32s ease-out, opacity .32s";
  card.style.transform = "translate(" + far + "px, " + (-60) + "px) rotate(" + (right ? 28 : -28) + "deg)";
  card.style.opacity = "0.6";
  setTimeout(() => { card.style.transition = ""; card.style.opacity = ""; cb(); }, 300);
}
function swipe(right, viaButtons){
  const pr = current;
  if (!pr) return;
  setStamp(right ? 1 : -1);
  if (right) { yes++; el("c-yes").textContent = yes; } else { no++; el("c-no").textContent = no; }
  if (!viaButtons && navigator.vibrate) navigator.vibrate(right ? 18 : 12);
  quip(right);
  if (right && yes % 10 === 0) match(pr);
  fly(right, () => render(nextPR()));
}

/* ---------- quips ---------- */
const LQ = ["A maintainer somewhere just felt a disturbance.",
 "That PR will cry itself to sleep tonight.",
 "The bot that wrote it never knew love anyway.",
 "Closed without prejudice. Some prejudice.",
 "Concept NACK'd. Emotionally devastating.",
 "It goes back to the queue. The queue is forever."];
const RQ = ["Merged on first review. Lucky you.",
 "Concept ACK. Now do the actual work.",
 "It's a match! CI is running the wedding.",
 "utACK. A love language of its own.",
 "Ship it. Tell no one how easy that was."];
let quipToggle = 0;
function quip(right){ toast(pick(right ? RQ : LQ, ++quipToggle)); }
let toastTimer = null;
function toast(msg){
  const t = el("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function match(pr){
  el("m-avatar").src = pr.avatar || "";
  el("m-text").textContent = "You and #" + pr.n + " (" + pr.author + ") have ACKed each other. The rebase can wait until tomorrow.";
  el("match").classList.add("show");
}

el("no").addEventListener("click", () => swipe(false, true));
el("yes").addEventListener("click", () => swipe(true, true));

render(nextPR());
</script>
